<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1210" viewBox="0 0 520 1210" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="af56e6-e76ad4-bfacf6-9c31ae2ea7db" role="img" aria-labelledby="integrations-mobile-light-title integrations-mobile-light-desc"><title id="integrations-mobile-light-title">pocgate integrations</title><desc id="integrations-mobile-light-desc">Phone integration layout: the binary in the centre, then pocgate.yaml, PoC scripts, regression, CI gate, evidence consumers and build requirements.</desc><defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a4ccb"/><stop offset=".55" stop-color="#aa4e9c"/><stop offset="1" stop-color="#766a97"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#9a4ccb" stop-opacity="0.13"/><stop offset="1" stop-color="#9a4ccb" stop-opacity="0"/></radialGradient>
<radialGradient id="halo2"><stop stop-color="#aa4e9c" stop-opacity="0.11"/><stop offset="1" stop-color="#aa4e9c" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e6cbf7" stroke-opacity=".55" stroke-width=".7"/></pattern>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#9a4ccb" stroke-width="1.6"/></marker>
</defs>
<style>
.flow{stroke-dasharray:7 11;animation:flow 7s linear infinite}
.pulse{animation:pulse 5.2s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-180}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><rect width="520" height="1210" rx="16" fill="#fcf9fe"/><rect width="520" height="1210" rx="16" fill="url(#grid)" opacity="0.75"/><text x="24" y="34" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#675e88" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0.7">04 / INTEGRATION</text><text x="24" y="68" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="21" fill="#1f1630" font-weight="400" text-anchor="start" opacity="1">What it touches</text><text x="24" y="92" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">PoCs you write, regression you already run.</text><circle cx="260" cy="152" r="48" fill="url(#halo)"/><circle cx="260" cy="152" r="42" fill="#fbf7fe" stroke="#9a4ccb" stroke-width="1.5"/><text x="260" y="150" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#9a4ccb" font-weight="700" text-anchor="middle" opacity="1">pocgate</text><text x="260" y="168" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#675e88" font-weight="400" text-anchor="middle" opacity="1">one binary</text><rect x="24" y="212" width="472" height="124" rx="10" fill="#fbf7fe" stroke="#e6cbf7" stroke-width="1.1" opacity="1"/><text x="40" y="240" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#9a4ccb" font-weight="700" text-anchor="start" opacity="1">pocgate.yaml</text><text x="40" y="268" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#1f1630" font-weight="400" text-anchor="start" opacity="1">target · oracles · regression · labels</text><text x="40" y="292" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">unknown field → exit 78</text><rect x="24" y="360" width="472" height="124" rx="10" fill="#fbf7fe" stroke="#e6cbf7" stroke-width="1.1" opacity="1"/><text x="40" y="388" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#9a4ccb" font-weight="700" text-anchor="start" opacity="1">PoC scripts</text><text x="40" y="416" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#1f1630" font-weight="400" text-anchor="start" opacity="1">any executable, sh fallback</text><text x="40" y="440" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">exit-code contract, not curl -f</text><rect x="24" y="508" width="472" height="124" rx="10" fill="#fbf7fe" stroke="#e6cbf7" stroke-width="1.1" opacity="1"/><text x="40" y="536" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#9a4ccb" font-weight="700" text-anchor="start" opacity="1">Regression</text><text x="40" y="564" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#1f1630" font-weight="400" text-anchor="start" opacity="1">exit_code or junit_xml</text><text x="40" y="588" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">junit_xml read from stdout</text><rect x="24" y="656" width="472" height="124" rx="10" fill="#fbf7fe" stroke="#e6cbf7" stroke-width="1.1" opacity="1"/><text x="40" y="684" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#9a4ccb" font-weight="700" text-anchor="start" opacity="1">CI gate</text><text x="40" y="712" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#1f1630" font-weight="400" text-anchor="start" opacity="1">--json · --fail-on</text><text x="40" y="736" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">verdicts stay 0 / 1 / 2 / 3</text><rect x="24" y="804" width="472" height="124" rx="10" fill="#fbf7fe" stroke="#e6cbf7" stroke-width="1.1" opacity="1"/><text x="40" y="832" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#9a4ccb" font-weight="700" text-anchor="start" opacity="1">Evidence consumers</text><text x="40" y="860" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#1f1630" font-weight="400" text-anchor="start" opacity="1">attest verify --pubkey</text><text x="40" y="884" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">offline, on another machine</text><rect x="24" y="952" width="472" height="124" rx="10" fill="#fbf7fe" stroke="#e6cbf7" stroke-width="1.1" opacity="1"/><text x="40" y="980" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#9a4ccb" font-weight="700" text-anchor="start" opacity="1">Build and release</text><text x="40" y="1008" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#1f1630" font-weight="400" text-anchor="start" opacity="1">go 1.24 · sh · patch · curl</text><text x="40" y="1032" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">linux/darwin amd64/arm64</text><line x1="24" y1="1112" x2="496" y2="1112" stroke="#e6cbf7" stroke-width="1"/><text x="24" y="1138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#9a4ccb" font-weight="500" text-anchor="start" opacity="1">No model calls, no patch writing,</text><text x="24" y="1160" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#9a4ccb" font-weight="500" text-anchor="start" opacity="1">no PoC generation.</text></svg>
