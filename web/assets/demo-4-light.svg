<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="af56e6-e76ad4-bfacf6-9c31ae2ea7db" role="img" aria-labelledby="demo-4-light-title demo-4-light-desc"><title id="demo-4-light-title">Attest verify — recorded result OK</title><desc id="demo-4-light-desc">attest verify card: the recorded evidence digest recomputed, the ed25519 signature verified, and the file was byte-for-byte canonical, without reading a clock or opening a socket.</desc><defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a4ccb"/><stop offset=".55" stop-color="#aa4e9c"/><stop offset="1" stop-color="#766a97"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#9a4ccb" stop-opacity="0.13"/><stop offset="1" stop-color="#9a4ccb" stop-opacity="0"/></radialGradient>
<radialGradient id="halo2"><stop stop-color="#aa4e9c" stop-opacity="0.11"/><stop offset="1" stop-color="#aa4e9c" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e6cbf7" stroke-opacity=".55" stroke-width=".7"/></pattern>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#9a4ccb" stroke-width="1.6"/></marker>
</defs>
<style>
.flow{stroke-dasharray:7 11;animation:flow 7s linear infinite}
.pulse{animation:pulse 5.2s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-180}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><rect width="760" height="300" rx="16" fill="#fcf9fe"/><rect width="760" height="300" rx="16" fill="url(#grid)" opacity="0.75"/><rect x="0" y="0" width="760" height="300" rx="16" fill="#fcf9fe" opacity="1"/><rect x="0" y="0" width="760" height="300" rx="16" fill="url(#grid)" opacity="0.7"/><ellipse cx="160" cy="40" rx="320" ry="190" fill="url(#halo)"/><text x="28" y="32" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#675e88" font-weight="500" text-anchor="start" opacity="1" letter-spacing="0.9">RECORDED RUN / 05 · ATTEST VERIFY</text><text x="28" y="80" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="34" fill="#0f7a4a" font-weight="700" text-anchor="start" opacity="1">OK</text><rect x="28" y="104" width="704" height="62" rx="10" fill="#f9f3fd" stroke="#e6cbf7" stroke-width="1.1" opacity="1"/><text x="44" y="126" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#1f1630" font-weight="500" text-anchor="start" opacity="1">pocgate attest verify --pubkey .pocgate/evidence/latest.json.pub</text><text x="44" y="148" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">.pocgate/evidence/latest.json</text><text x="28" y="196" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#1f1630" font-weight="500" text-anchor="start" opacity="1">digest f397ce755b68… recomputed · signature valid</text><text x="28" y="220" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">file is byte-for-byte canonical · one changed byte fails</text><line x1="28" y1="238" x2="732" y2="238" stroke="#e6cbf7" stroke-width="1"/><text x="28" y="262" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#9a4ccb" font-weight="600" text-anchor="start" opacity="1">no clock read · no socket opened · no server involved</text><text x="28" y="283" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">the .pub beside the evidence only proves the files agree; bring the key over another channel</text></svg>
