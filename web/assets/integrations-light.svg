<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="af56e6-e76ad4-bfacf6-9c31ae2ea7db" role="img" aria-labelledby="integrations-light-title integrations-light-desc"><title id="integrations-light-title">pocgate integrations</title><desc id="integrations-light-desc">Integration map around one binary: pocgate.yaml with target, oracles, regression and labels; executable PoC scripts with an exit-code contract; regression through exit_code or junit_xml on stdout; a CI gate through --json and --fail-on; evidence consumed by attest verify offline on another machine; builds needing go, sh, patch and curl with release tarballs for linux and darwin on amd64 and arm64. The tool calls no model, writes no patch and generates no PoC.</desc><defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a4ccb"/><stop offset=".55" stop-color="#aa4e9c"/><stop offset="1" stop-color="#766a97"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#9a4ccb" stop-opacity="0.13"/><stop offset="1" stop-color="#9a4ccb" stop-opacity="0"/></radialGradient>
<radialGradient id="halo2"><stop stop-color="#aa4e9c" stop-opacity="0.11"/><stop offset="1" stop-color="#aa4e9c" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e6cbf7" stroke-opacity=".55" stroke-width=".7"/></pattern>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#9a4ccb" stroke-width="1.6"/></marker>
</defs>
<style>
.flow{stroke-dasharray:7 11;animation:flow 7s linear infinite}
.pulse{animation:pulse 5.2s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-180}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><rect width="1000" height="640" rx="16" fill="#fcf9fe"/><rect width="1000" height="640" rx="16" fill="url(#grid)" opacity="0.75"/><text x="40" y="38" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#675e88" font-weight="500" text-anchor="start" opacity="1" letter-spacing="0.8">04 / INTEGRATION</text><text x="40" y="78" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="26" fill="#1f1630" font-weight="400" text-anchor="start" opacity="1">Everything it touches, and nothing it does not</text><text x="40" y="104" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">It runs the PoCs you write and signs what it observed — nothing else.</text><ellipse cx="500" cy="356" rx="330" ry="196" fill="none" stroke="#e6cbf7" stroke-width="1" stroke-dasharray="3 7"/><ellipse cx="500" cy="356" rx="250" ry="146" fill="none" stroke="#e6cbf7" stroke-width="1" stroke-dasharray="3 7" opacity=".7"/><circle cx="500" cy="356" r="72" fill="url(#halo)"/><circle cx="500" cy="356" r="64" fill="#fbf7fe" stroke="#9a4ccb" stroke-width="1.5"/><text x="500" y="352" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#9a4ccb" font-weight="700" text-anchor="middle" opacity="1">pocgate</text><text x="500" y="374" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#675e88" font-weight="400" text-anchor="middle" opacity="1">one binary</text><rect x="40" y="140" width="260" height="96" rx="12" fill="#fbf7fe" stroke="#e6cbf7" stroke-width="1.1" opacity="1"/><text x="56" y="170" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#9a4ccb" font-weight="700" text-anchor="start" opacity="1">pocgate.yaml</text><text x="56" y="194" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#1f1630" font-weight="400" text-anchor="start" opacity="1">target · oracles · regression · labels</text><text x="56" y="216" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">unknown field → exit 78</text><path d="M436 356L300 188" fill="none" stroke="#9a4ccb" stroke-width="1.1" opacity="0.55" stroke-dasharray="5 7"/><circle cx="300" cy="188" r="3" fill="#9a4ccb"/><rect x="700" y="140" width="260" height="96" rx="12" fill="#fbf7fe" stroke="#e6cbf7" stroke-width="1.1" opacity="1"/><text x="716" y="170" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#9a4ccb" font-weight="700" text-anchor="start" opacity="1">PoC scripts</text><text x="716" y="194" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#1f1630" font-weight="400" text-anchor="start" opacity="1">any executable, sh fallback</text><text x="716" y="216" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">exit-code contract, not curl -f</text><path d="M564 356L700 188" fill="none" stroke="#9a4ccb" stroke-width="1.1" opacity="0.55" stroke-dasharray="5 7"/><circle cx="700" cy="188" r="3" fill="#9a4ccb"/><rect x="40" y="312" width="260" height="96" rx="12" fill="#fbf7fe" stroke="#e6cbf7" stroke-width="1.1" opacity="1"/><text x="56" y="342" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#9a4ccb" font-weight="700" text-anchor="start" opacity="1">Regression</text><text x="56" y="366" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#1f1630" font-weight="400" text-anchor="start" opacity="1">exit_code or junit_xml</text><text x="56" y="388" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">junit_xml read from stdout</text><path d="M436 356L300 360" fill="none" stroke="#9a4ccb" stroke-width="1.1" opacity="0.55" stroke-dasharray="5 7"/><circle cx="300" cy="360" r="3" fill="#9a4ccb"/><rect x="700" y="312" width="260" height="96" rx="12" fill="#fbf7fe" stroke="#e6cbf7" stroke-width="1.1" opacity="1"/><text x="716" y="342" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#9a4ccb" font-weight="700" text-anchor="start" opacity="1">CI gate</text><text x="716" y="366" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#1f1630" font-weight="400" text-anchor="start" opacity="1">--json · --fail-on</text><text x="716" y="388" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">verdicts stay 0 / 1 / 2 / 3</text><path d="M564 356L700 360" fill="none" stroke="#9a4ccb" stroke-width="1.1" opacity="0.55" stroke-dasharray="5 7"/><circle cx="700" cy="360" r="3" fill="#9a4ccb"/><rect x="40" y="484" width="260" height="96" rx="12" fill="#fbf7fe" stroke="#e6cbf7" stroke-width="1.1" opacity="1"/><text x="56" y="514" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#9a4ccb" font-weight="700" text-anchor="start" opacity="1">Evidence consumers</text><text x="56" y="538" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#1f1630" font-weight="400" text-anchor="start" opacity="1">attest verify --pubkey</text><text x="56" y="560" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">offline, on another machine</text><path d="M436 356L300 532" fill="none" stroke="#9a4ccb" stroke-width="1.1" opacity="0.55" stroke-dasharray="5 7"/><circle cx="300" cy="532" r="3" fill="#9a4ccb"/><rect x="700" y="484" width="260" height="96" rx="12" fill="#fbf7fe" stroke="#e6cbf7" stroke-width="1.1" opacity="1"/><text x="716" y="514" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#9a4ccb" font-weight="700" text-anchor="start" opacity="1">Build and release</text><text x="716" y="538" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#1f1630" font-weight="400" text-anchor="start" opacity="1">go 1.24 · sh · patch · curl</text><text x="716" y="560" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#675e88" font-weight="400" text-anchor="start" opacity="1">linux/darwin amd64/arm64</text><path d="M564 356L700 532" fill="none" stroke="#9a4ccb" stroke-width="1.1" opacity="0.55" stroke-dasharray="5 7"/><circle cx="700" cy="532" r="3" fill="#9a4ccb"/><line x1="40" y1="604" x2="960" y2="604" stroke="#e6cbf7" stroke-width="1"/><text x="40" y="628" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#9a4ccb" font-weight="500" text-anchor="start" opacity="1">No model calls, no patch writing, no PoC generation — the review of what an agent produced stays a measurement.</text></svg>
