<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1160" viewBox="0 0 520 1160" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="af56e6-e76ad4-bfacf6-9c31ae2ea7db" role="img" aria-labelledby="process-mobile-dark-title process-mobile-dark-desc"><title id="process-mobile-dark-title">pocgate process</title><desc id="process-mobile-dark-desc">Phone process layout: baseline, patch written elsewhere, verify in a scratch copy, verdict with exit codes, attest offline.</desc><defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#af56e6"/><stop offset=".55" stop-color="#e76ad4"/><stop offset="1" stop-color="#bfacf6"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#af56e6" stop-opacity="0.13"/><stop offset="1" stop-color="#af56e6" stop-opacity="0"/></radialGradient>
<radialGradient id="halo2"><stop stop-color="#e76ad4" stop-opacity="0.11"/><stop offset="1" stop-color="#e76ad4" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2d1841" stroke-opacity=".55" stroke-width=".7"/></pattern>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#af56e6" stroke-width="1.6"/></marker>
</defs>
<style>
.flow{stroke-dasharray:7 11;animation:flow 7s linear infinite}
.pulse{animation:pulse 5.2s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-180}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><rect width="520" height="1160" rx="16" fill="#080712"/><rect width="520" height="1160" rx="16" fill="url(#grid)" opacity="0.75"/><text x="24" y="34" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#a79cc4" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0.7">03 / WORKFLOW</text><text x="24" y="68" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="21" fill="#f2eefd" font-weight="400" text-anchor="start" opacity="1">Patch in, verdict out</text><text x="24" y="92" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">Only the scratch copy receives the patch.</text><rect x="24" y="112" width="472" height="186" rx="12" fill="#10101f" stroke="#2d1841" stroke-width="1.1" opacity="1"/><rect x="24" y="112" width="472" height="4" rx="2" fill="#ff6473"/><text x="42" y="146" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#ff6473" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0.6">01</text><text x="42" y="176" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#f2eefd" font-weight="700" text-anchor="start" opacity="1">BASELINE</text><text x="42" y="204" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">build · start · wait TCP</text><text x="42" y="224" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">each PoC × repeats</text><text x="42" y="244" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">every run must fire</text><line x1="42" y1="254" x2="478" y2="254" stroke="#2d1841" stroke-width="1" opacity=".8"/><text x="42" y="276" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#ff6473" font-weight="600" text-anchor="start" opacity="1">else INCONCLUSIVE, no file</text><path d="M260 302V314" fill="none" stroke="#af56e6" stroke-width="1.3" opacity="1" marker-end="url(#arrow)"/><rect x="24" y="318" width="472" height="186" rx="12" fill="#10101f" stroke="#2d1841" stroke-width="1.1" opacity="1"/><rect x="24" y="318" width="472" height="4" rx="2" fill="#a79cc4"/><text x="42" y="352" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#a79cc4" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0.6">02</text><text x="42" y="382" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#f2eefd" font-weight="700" text-anchor="start" opacity="1">PATCH ELSEWHERE</text><text x="42" y="410" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">diff written outside</text><text x="42" y="430" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">the target tree stays</text><text x="42" y="450" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">at its baseline state</text><line x1="42" y1="460" x2="478" y2="460" stroke="#2d1841" stroke-width="1" opacity=".8"/><text x="42" y="482" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#a79cc4" font-weight="600" text-anchor="start" opacity="1">git diff &gt; fix.diff</text><path d="M260 508V520" fill="none" stroke="#af56e6" stroke-width="1.3" opacity="1" marker-end="url(#arrow)"/><rect x="24" y="524" width="472" height="186" rx="12" fill="#10101f" stroke="#2d1841" stroke-width="1.1" opacity="1"/><rect x="24" y="524" width="472" height="4" rx="2" fill="#af56e6"/><text x="42" y="558" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#af56e6" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0.6">03</text><text x="42" y="588" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#f2eefd" font-weight="700" text-anchor="start" opacity="1">VERIFY</text><text x="42" y="616" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">scratch copy in $TMPDIR</text><text x="42" y="636" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">apply · rebuild · rerun</text><text x="42" y="656" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">PoCs × repeats + regression</text><line x1="42" y1="666" x2="478" y2="666" stroke="#2d1841" stroke-width="1" opacity=".8"/><text x="42" y="688" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#af56e6" font-weight="600" text-anchor="start" opacity="1">deleted afterwards</text><path d="M260 714V726" fill="none" stroke="#af56e6" stroke-width="1.3" opacity="1" marker-end="url(#arrow)"/><rect x="24" y="730" width="472" height="186" rx="12" fill="#10101f" stroke="#2d1841" stroke-width="1.1" opacity="1"/><rect x="24" y="730" width="472" height="4" rx="2" fill="#3ee08a"/><text x="42" y="764" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#3ee08a" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0.6">04</text><text x="42" y="794" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#f2eefd" font-weight="700" text-anchor="start" opacity="1">VERDICT</text><text x="42" y="822" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">three legs across</text><text x="42" y="842" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">pre, post and regression</text><text x="42" y="862" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">→ four states</text><line x1="42" y1="872" x2="478" y2="872" stroke="#2d1841" stroke-width="1" opacity=".8"/><text x="42" y="894" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#3ee08a" font-weight="600" text-anchor="start" opacity="1">exit 0 / 1 / 2 / 3</text><path d="M260 920V932" fill="none" stroke="#af56e6" stroke-width="1.3" opacity="1" marker-end="url(#arrow)"/><rect x="24" y="936" width="472" height="186" rx="12" fill="#10101f" stroke="#2d1841" stroke-width="1.1" opacity="1"/><rect x="24" y="936" width="472" height="4" rx="2" fill="#3ee08a"/><text x="42" y="970" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#3ee08a" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0.6">05</text><text x="42" y="1000" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#f2eefd" font-weight="700" text-anchor="start" opacity="1">ATTEST</text><text x="42" y="1028" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">canonical JSON, sha256</text><text x="42" y="1048" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">ed25519 signature</text><text x="42" y="1068" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">recomputed on another box</text><line x1="42" y1="1078" x2="478" y2="1078" stroke="#2d1841" stroke-width="1" opacity=".8"/><text x="42" y="1100" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#3ee08a" font-weight="600" text-anchor="start" opacity="1">offline · no clock</text><text x="24" y="1138" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">Tracked tree: unchanged except .pocgate/.</text></svg>
