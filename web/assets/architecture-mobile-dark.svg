<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1000" viewBox="0 0 520 1000" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="af56e6-e76ad4-bfacf6-9c31ae2ea7db" role="img" aria-labelledby="architecture-mobile-dark-title architecture-mobile-dark-desc"><title id="architecture-mobile-dark-title">pocgate architecture</title><desc id="architecture-mobile-dark-desc">Phone architecture layout: CLI, then spec, exec, oracle and regress, then verdict and evidence, then the three files on disk.</desc><defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#af56e6"/><stop offset=".55" stop-color="#e76ad4"/><stop offset="1" stop-color="#bfacf6"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#af56e6" stop-opacity="0.13"/><stop offset="1" stop-color="#af56e6" stop-opacity="0"/></radialGradient>
<radialGradient id="halo2"><stop stop-color="#e76ad4" stop-opacity="0.11"/><stop offset="1" stop-color="#e76ad4" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2d1841" stroke-opacity=".55" stroke-width=".7"/></pattern>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#af56e6" stroke-width="1.6"/></marker>
</defs>
<style>
.flow{stroke-dasharray:7 11;animation:flow 7s linear infinite}
.pulse{animation:pulse 5.2s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-180}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><rect width="520" height="1000" rx="16" fill="#080712"/><rect width="520" height="1000" rx="16" fill="url(#grid)" opacity="0.75"/><text x="24" y="34" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#a79cc4" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0.7">02 / ARCHITECTURE</text><text x="24" y="68" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="21" fill="#f2eefd" font-weight="400" text-anchor="start" opacity="1">One process boundary</text><text x="24" y="92" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">No server, no database, no network.</text><rect x="24" y="112" width="472" height="62" rx="10" fill="#100d1d" stroke="#af56e6" stroke-width="1.4" opacity="1"/><text x="40" y="138" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#af56e6" font-weight="700" text-anchor="start" opacity="1">cmd/pocgate</text><text x="40" y="160" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#f2eefd" font-weight="400" text-anchor="start" opacity="1">init · doctor · baseline · verify · demo · attest</text><rect x="24" y="206" width="472" height="76" rx="10" fill="#10101f" stroke="#2d1841" stroke-width="1.1" opacity="1"/><text x="40" y="236" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#af56e6" font-weight="700" text-anchor="start" opacity="1">internal/spec</text><text x="40" y="260" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">schema owner · unknown field → exit 78</text><rect x="24" y="298" width="472" height="76" rx="10" fill="#10101f" stroke="#2d1841" stroke-width="1.1" opacity="1"/><text x="40" y="328" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#af56e6" font-weight="700" text-anchor="start" opacity="1">internal/exec</text><text x="40" y="352" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">build · start · wait TCP · stop group</text><rect x="24" y="390" width="472" height="76" rx="10" fill="#10101f" stroke="#2d1841" stroke-width="1.1" opacity="1"/><text x="40" y="420" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#af56e6" font-weight="700" text-anchor="start" opacity="1">internal/oracle</text><text x="40" y="444" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">repeats runs · FIRED / SILENT / UNOBSERVED</text><rect x="24" y="482" width="472" height="76" rx="10" fill="#10101f" stroke="#2d1841" stroke-width="1.1" opacity="1"/><text x="40" y="512" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#af56e6" font-weight="700" text-anchor="start" opacity="1">internal/regress</text><text x="40" y="536" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">exit_code or junit_xml from stdout</text><rect x="24" y="574" width="472" height="76" rx="10" fill="#10101f" stroke="#2d1841" stroke-width="1.1" opacity="1"/><text x="40" y="604" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#af56e6" font-weight="700" text-anchor="start" opacity="1">internal/verdict</text><text x="40" y="628" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">three observations → 4 states, 0/1/2/3</text><rect x="24" y="666" width="472" height="76" rx="10" fill="#10101f" stroke="#2d1841" stroke-width="1.1" opacity="1"/><text x="40" y="696" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#af56e6" font-weight="700" text-anchor="start" opacity="1">internal/evidence</text><text x="40" y="720" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">canonical JSON · sha256 · ed25519</text><line x1="24" y1="772" x2="496" y2="772" stroke="#2d1841" stroke-width="1"/><text x="24" y="796" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#f2eefd" font-weight="600" text-anchor="start" opacity="1">.pocgate/baseline.json</text><text x="250" y="796" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">digests of spec and source tree</text><text x="24" y="858" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#f2eefd" font-weight="600" text-anchor="start" opacity="1">.pocgate/evidence/latest.json</text><text x="250" y="858" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">signed evidence, plus its .pub</text><text x="24" y="920" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#f2eefd" font-weight="600" text-anchor="start" opacity="1">~/.pocgate/key</text><text x="250" y="920" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#a79cc4" font-weight="400" text-anchor="start" opacity="1">ed25519 private key, mode 0600</text></svg>
