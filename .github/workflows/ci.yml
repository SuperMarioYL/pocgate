name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        # The end-to-end tests start the bundled fixture on 127.0.0.1 and probe
        # it with curl; the ubuntu runner ships sh, patch and curl.
        run: go test -race ./...

      - name: build
        run: go build ./...

      - name: cross-compile
        # The release matrix is linux/darwin/windows x amd64/arm64; catch a
        # platform-specific break on a pull request instead of a tag.
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "building $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
          done
