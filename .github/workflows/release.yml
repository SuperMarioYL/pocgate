name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          name="pocgate_${version}_${GOOS}_${GOARCH}"

          if [ "$version" != "$(cat VERSION)" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ($(cat VERSION))" >&2
            exit 1
          fi

          mkdir -p "dist/${name}"
          if [ "$GOOS" = "windows" ]; then
            go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "dist/${name}/pocgate.exe" ./cmd/pocgate
          else
            go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "dist/${name}/pocgate" ./cmd/pocgate
          fi
          cp LICENSE README.md CHANGELOG.md "dist/${name}/"

          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -qr "${name}.zip" "${name}")
          else
            (cd dist && tar -czf "${name}.tar.gz" "${name}")
          fi
          rm -rf "dist/${name}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          # Every archive above is attached explicitly; a release whose body
          # promises binaries but carries no assets is a known failure mode.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
